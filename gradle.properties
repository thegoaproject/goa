org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx1024m


# Public custom domain of the "goa" R2 bucket that mirrors the freeware archives (override with -Pgoa.cdnBaseUrl=...)
goa.cdnBaseUrl=https://cdn.goodoldandroid.app

# Opt-in game health telemetry collection service (infra/telemetry-worker); empty disables uploads
goa.telemetryBaseUrl=https://api.goodoldandroid.app

# Edition: play = GOA as published on Google Play. The public source is published with goa.edition=oss (GOA OSS: its own
# package, name, icon and Material You colours); scripts/publish-public-source.sh sets that on every publish.

# GOA OSS edition: this source builds GOA OSS (app/build.gradle.kts). Do not change: GOA itself is built privately.
goa.edition=oss
